name: iOS Encrypted Test (Injection Parity)
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Smart Wasla Test'
      bundle_id:
        description: 'iOS Bundle ID'
        required: false
        default: 'com.smartwasla.app'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decrypt and Run iOS Payload
        env:
          PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          RUN_ID: ${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPABASE_EDGE_URL: 'https://example.com'
        run: |
          set -euo pipefail
          if [ -z "${PAYLOAD_KEY:-}" ]; then
            echo "PAYLOAD_KEY is missing"
            exit 1
          fi
          echo "Decrypting iOS Payload (encrypted-path parity test)..."
          echo "$PAYLOAD_KEY" > /tmp/payload.key
          mkdir -p /tmp/secure_run
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in .github/secure/secret-payload-ios.sh.enc \
            -out /tmp/secure_run/secret-payload-ios.sh \
            -pass file:/tmp/payload.key
          chmod +x /tmp/secure_run/secret-payload-ios.sh
          echo "Executing decrypted iOS Payload..."
          /tmp/secure_run/secret-payload-ios.sh

      - name: Wipe Artifacts
        if: always()
        run: rm -rf /tmp/payload.key /tmp/secure_run
